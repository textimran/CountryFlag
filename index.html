<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flag Battle Royale - 9:16 Reels Mode</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Font: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        /* 9:16 Vertical Reels Aspect Ratio Container */
        .reels-frame {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 94vh;
            aspect-ratio: 9 / 16;
            background: linear-gradient(180deg, #090d16 0%, #030712 100%);
            border: 3px solid rgba(6, 182, 212, 0.35);
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.2), 0 0 80px rgba(0, 0, 0, 0.8);
            border-radius: 28px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Space Drift Starfield */
        .stars-bg {
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #38bdf8, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #f472b6, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: spaceDrift 90s linear infinite;
        }

        @keyframes spaceDrift {
            from { background-position: 0 0; }
            to { background-position: 800px 800px; }
        }

        /* Pop Animation for Eliminated Badges */
        @keyframes popIn {
            0% { transform: scale(0) translateY(8px); opacity: 0; }
            80% { transform: scale(1.1) translateY(0); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Neon Text Glow */
        .neon-gold {
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.8), 0 0 20px rgba(245, 158, 11, 0.4);
        }

        /* Custom Scrollbar Hide */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="stars-bg h-screen w-screen flex items-center justify-center p-2">

    <!-- 9:16 REELS CONTAINER -->
    <div class="reels-frame p-3 z-10">
        
        <!-- HEADER OVERLAY (TOP) -->
        <header class="w-full flex justify-between items-start gap-2 z-20">
            <!-- Round & Remaining Status -->
            <div class="glass-panel p-2.5 rounded-2xl border-cyan-500/30 flex flex-col space-y-0.5">
                <div class="flex items-center space-x-1.5">
                    <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                    <span id="roundNumber" class="text-xs font-black uppercase text-cyan-400 tracking-wider">ROUND 1</span>
                </div>
                <span id="remainingCount" class="text-base font-extrabold text-white">50 Remaining</span>
            </div>

            <!-- Mini Leaderboard Widget -->
            <div class="glass-panel p-2 rounded-2xl border-amber-500/30 w-36 max-h-28 flex flex-col">
                <div class="flex items-center justify-between border-b border-gray-700/80 pb-1 mb-1">
                    <span class="text-[10px] font-black uppercase text-amber-400 tracking-wider flex items-center gap-1">
                        <i class="fa-solid fa-trophy"></i> LEADERBOARD
                    </span>
                    <button id="resetLeaderboardBtn" title="Reset" class="text-gray-400 hover:text-red-400 text-[10px]">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
                <div id="leaderboardList" class="overflow-y-auto no-scrollbar space-y-1 text-[11px] font-semibold">
                    <span class="text-gray-500 text-center block text-[10px] py-1 italic">No wins yet</span>
                </div>
            </div>
        </header>

        <!-- HAZARD WARNING BANNER -->
        <div id="alertBanner" class="hidden self-center glass-panel px-4 py-1.5 rounded-full border-amber-500/60 bg-amber-500/20 text-amber-300 font-extrabold text-xs tracking-wider animate-pulse flex items-center gap-1.5 z-20 my-1">
            <i class="fa-solid fa-triangle-exclamation text-amber-400"></i>
            <span id="alertText">FINAL 5 COUNTRIES!</span>
        </div>

        <!-- CANVAS ARENA (MIDDLE REELS SPACE) -->
        <main class="relative flex-grow w-full flex items-center justify-center my-1">
            <canvas id="gameCanvas" class="w-full h-full rounded-2xl cursor-pointer"></canvas>

            <!-- WINNER POPUP OVERLAY -->
            <div id="winnerOverlay" class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center text-center p-4 transition-all duration-500 opacity-0 pointer-events-none z-30">
                <div class="text-5xl text-amber-400 mb-1 animate-bounce">🏆</div>
                <div class="text-amber-400 font-black text-xs tracking-widest uppercase">VICTORY CHAMPION</div>
                <div id="winnerFlagContainer" class="w-20 h-20 my-3 rounded-full border-4 border-amber-400 shadow-2xl overflow-hidden flex items-center justify-center bg-gray-900">
                    <!-- Flag Image Inserted via JS -->
                </div>
                <h2 id="winnerName" class="text-2xl font-black text-white mb-1 neon-gold">Country Name</h2>
                <p id="winnerSubtext" class="text-xs text-cyan-300 font-bold mb-3">Total Wins: 1 | Next Round...</p>
                <div class="w-40 bg-gray-800 h-2 rounded-full overflow-hidden border border-gray-700">
                    <div id="nextRoundProgress" class="bg-amber-400 h-full w-0 transition-all duration-4000 ease-linear"></div>
                </div>
            </div>
        </main>

        <!-- TOOLBAR CONTROLS -->
        <div class="w-full glass-panel p-2 rounded-2xl flex items-center justify-between gap-1.5 z-20 mb-2">
            <div class="flex items-center space-x-1.5">
                <button id="playPauseBtn" class="bg-cyan-600 hover:bg-cyan-500 text-white px-2.5 py-1.5 rounded-xl text-xs font-black transition flex items-center gap-1 shadow-md shadow-cyan-600/30">
                    <i id="playPauseIcon" class="fa-solid fa-pause"></i>
                    <span id="playPauseText">Pause</span>
                </button>
                <button id="skipRoundBtn" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-2 py-1.5 rounded-xl text-xs font-bold border border-gray-700" title="Skip Round">
                    <i class="fa-solid fa-forward-step text-cyan-400"></i>
                </button>
                <button id="nudgeBtn" class="bg-amber-600 hover:bg-amber-500 text-white px-2 py-1.5 rounded-xl text-xs font-bold border border-amber-500/50" title="Hazard Shockwave">
                    <i class="fa-solid fa-bolt text-amber-300"></i>
                </button>
            </div>

            <!-- Speed Controls -->
            <div class="flex items-center space-x-1 bg-gray-900/90 px-1.5 py-1 rounded-xl border border-gray-800">
                <button class="speed-btn px-2 py-0.5 text-[11px] font-bold rounded-lg bg-gray-800 text-gray-300" data-speed="1">1x</button>
                <button class="speed-btn px-2 py-0.5 text-[11px] font-bold rounded-lg bg-cyan-600 text-white font-black" data-speed="2">2x</button>
                <button class="speed-btn px-2 py-0.5 text-[11px] font-bold rounded-lg bg-gray-800 text-gray-300" data-speed="4">4x</button>
            </div>

            <!-- Voice TTS Button -->
            <button id="ttsToggleBtn" class="bg-gray-800 hover:bg-gray-700 text-cyan-400 px-2 py-1.5 rounded-xl text-xs font-bold border border-gray-700">
                <i id="ttsIcon" class="fa-solid fa-volume-high"></i>
            </button>
        </div>

        <!-- ELIMINATED TRAY (BOTTOM) -->
        <footer class="w-full glass-panel p-2 rounded-2xl border-red-500/30 flex items-center space-x-2 z-20">
            <div class="bg-red-500/20 border border-red-500/40 text-red-400 text-[10px] font-black uppercase tracking-wider px-2 py-1 rounded-lg shrink-0 flex items-center gap-1">
                <i class="fa-solid fa-skull"></i> OUT:
            </div>
            <div id="eliminatedContainer" class="flex items-center space-x-1.5 overflow-x-auto no-scrollbar py-0.5 flex-grow scroll-smooth">
                <span class="text-gray-500 text-[11px] italic px-1">Flags fly outside ring when eliminated!</span>
            </div>
        </footer>

    </div>

    <script>
        // Pre-populated Countries Dataset with high quality flag SVGs
        const COUNTRIES_DATA = [
            { name: "Bangladesh", code: "bd", color: "#006a4e" },
            { name: "United States", code: "us", color: "#3c3b6e" },

            { name: "Germany", code: "de", color: "#dd0000" },
            { name: "France", code: "fr", color: "#002395" },

            { name: "Saudi Arabia", code: "sa", color: "#006c35" },
            { name: "Portugal", code: "pt", color: "#046a38" },
            { name: "Netherlands", code: "nl", color: "#ae1c28" },

            { name: "Morocco", code: "ma", color: "#c1272d" },
            { name: "Sweden", code: "se", color: "#006aa7" },
            { name: "Switzerland", code: "ch", color: "#da291c" },
            { name: "Egypt", code: "eg", color: "#c09300" },
            { name: "Nigeria", code: "ng", color: "#008751" },
            { name: "Pakistan", code: "pk", color: "#01411c" },
            { name: "Indonesia", code: "id", color: "#ce1126" },
            { name: "Greece", code: "gr", color: "#0d5eaf" },
            { name: "Colombia", code: "co", color: "#fcd116" },
            { name: "Chile", code: "cl", color: "#d52b1e" },
            { name: "Norway", code: "no", color: "#ba0c2f" },
            { name: "Ireland", code: "ie", color: "#169b62" },
            { name: "New Zealand", code: "nz", color: "#00247d" },
            { name: "United Arab Emirates", code: "ae", color: "#ff0000" },
            { name: "Qatar", code: "qa", color: "#8a1538" },
            { name: "Denmark", code: "dk", color: "#c8102e" },
            { name: "Finland", code: "fi", color: "#002f6c" },
            { name: "Croatia", code: "hr", color: "#ff0000" },
            { name: "Belgium", code: "be", color: "#000000" },
            { name: "Poland", code: "pl", color: "#dc143c" },
            { name: "Ukraine", code: "ua", color: "#0057b7" },
            { name: "Vietnam", code: "vn", color: "#da251d" },
            { name: "Kenya", code: "ke", color: "#000000" },
            { name: "Czechia", code: "cz", color: "#11457e" },
            { name: "Uruguay", code: "uy", color: "#0038a8" },
            { name: "Peru", code: "pe", color: "#d91023" },
            { name: "Philippines", code: "ph", color: "#0038a8" },
            { name: "Malaysia", code: "my", color: "#010066" }
        ];

        class AudioSystem {
            constructor() {
                this.speechEnabled = true;
                this.synth = window.speechSynthesis;
            }

            speak(text) {
                if (!this.speechEnabled || !this.synth) return;
                try {
                    this.synth.cancel(); // Stop ongoing speech so new callout is immediate
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 1.2;
                    utterance.pitch = 1.0;
                    utterance.lang = 'en-US';
                    this.synth.speak(utterance);
                } catch(e) {}
            }
        }

        const audio = new AudioSystem();

        class FlagBall {
            constructor(country, x, y, radius, flagImage) {
                this.id = country.code;
                this.name = country.name;
                this.code = country.code;
                this.color = country.color;
                
                this.x = x;
                this.y = y;
                this.r = radius;
                this.vx = (Math.random() - 0.5) * 3.5;
                this.vy = (Math.random() - 0.5) * 3.5;
                if (Math.abs(this.vx) < 1) this.vx = 2;
                if (Math.abs(this.vy) < 1) this.vy = 2;

                this.flagImage = flagImage;
                this.state = 'BOUNCING'; // 'BOUNCING', 'EJECTING', 'ELIMINATED'
                this.ejectTimer = 0;
                this.alpha = 1.0;
                this.trail = [];
            }

            update(dt, centerX, centerY, arenaRadius, gapAngle, gapWidth) {
                if (this.state === 'ELIMINATED') return;

                // State 1: EJECTING (Ball flies OUTSIDE the red circular ring)
                if (this.state === 'EJECTING') {
                    this.ejectTimer += dt;
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // Add motion trail
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > 6) this.trail.shift();

                    this.alpha = Math.max(0, 1 - (this.ejectTimer / 40));
                    return;
                }

                // State 2: BOUNCING Inside Arena
                this.x += this.vx * dt;
                this.y += this.vy * dt;

                const dx = this.x - centerX;
                const dy = this.y - centerY;
                const dist = Math.hypot(dx, dy);
                const maxAllowedDist = arenaRadius - this.r;

                if (dist > maxAllowedDist) {
                    // Calculate angle from ring center [0, 2*PI]
                    let angle = Math.atan2(dy, dx);
                    if (angle < 0) angle += Math.PI * 2;

                    let gStart = gapAngle % (Math.PI * 2);
                    if (gStart < 0) gStart += Math.PI * 2;
                    let gEnd = (gStart + gapWidth) % (Math.PI * 2);

                    let isInGap = false;
                    if (gStart < gEnd) {
                        isInGap = (angle >= gStart && angle <= gEnd);
                    } else {
                        isInGap = (angle >= gStart || angle <= gEnd);
                    }

                    if (isInGap) {
                        // EXITS THROUGH THE ROTATING RED GAP OUTWARDS!
                        this.triggerEjection(angle);
                    } else {
                        // Reflect Back Inside Arena Wall
                        const nx = dx / (dist || 1);
                        const ny = dy / (dist || 1);

                        this.x = centerX + nx * maxAllowedDist;
                        this.y = centerY + ny * maxAllowedDist;

                        const dot = this.vx * nx + this.vy * ny;
                        this.vx = (this.vx - 2 * dot * nx) * 0.98;
                        this.vy = (this.vy - 2 * dot * ny) * 0.98;

                        this.vx += (Math.random() - 0.5) * 0.3;
                        this.vy += (Math.random() - 0.5) * 0.3;
                    }
                }
            }

            triggerEjection(exitAngle) {
                if (this.state !== 'BOUNCING') return;
                this.state = 'EJECTING';
                this.ejectTimer = 0;

                const speed = 6 + Math.random() * 3;
                this.vx = Math.cos(exitAngle) * speed;
                this.vy = Math.sin(exitAngle) * speed;

                audio.speak(`${this.name} eliminated!`);
            }
        }

        class GameEngine {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.round = 1;
                this.simSpeed = 2;
                this.isPaused = false;
                this.isRoundOver = false;

                this.balls = [];
                this.leaderboard = {};
                this.particles = [];

                this.centerX = 0;
                this.centerY = 0;
                this.arenaRadius = 0;

                this.gapAngle = 0;
                this.gapWidth = Math.PI / 4.2; // Opening gap size
                this.gapSpeed = 0.018;

                this.flagImages = {};
                this.preloadFlags();

                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            preloadFlags() {
                COUNTRIES_DATA.forEach(c => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.src = `https://flagcdn.com/w160/${c.code}.png`;
                    this.flagImages[c.code] = img;
                });
            }

            resizeCanvas() {
                const rect = this.canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;

                this.canvas.width = rect.width * dpr;
                this.canvas.height = rect.height * dpr;
                this.ctx.scale(dpr, dpr);

                this.centerX = rect.width / 2;
                this.centerY = rect.height / 2;
                // Arena circle leaves outer space for ejected balls to fly outside
                this.arenaRadius = (Math.min(rect.width, rect.height) / 2) - 30;
            }

            initRound() {
                this.isRoundOver = false;
                this.balls = [];
                this.particles = [];
                this.gapAngle = Math.random() * Math.PI * 2;

                document.getElementById('eliminatedContainer').innerHTML = '';
                document.getElementById('winnerOverlay').classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('nextRoundProgress').style.width = '0%';
                document.getElementById('alertBanner').classList.add('hidden');
                document.getElementById('roundNumber').innerText = `ROUND ${this.round}`;

                const shuffled = [...COUNTRIES_DATA].sort(() => Math.random() - 0.5);
                const ballRadius = Math.max(10, Math.min(14, this.arenaRadius / 14));

                shuffled.forEach((country) => {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.sqrt(Math.random()) * (this.arenaRadius - ballRadius - 10);

                    const x = this.centerX + Math.cos(angle) * dist;
                    const y = this.centerY + Math.sin(angle) * dist;

                    const ball = new FlagBall(country, x, y, ballRadius, this.flagImages[country.code]);
                    this.balls.push(ball);
                });

                this.updateUI();
                audio.speak(`Round ${this.round} start!`);
            }

            nudgeHazard() {
                const active = this.balls.filter(b => b.state === 'BOUNCING');
                if (active.length <= 1) return;

                const target = active[Math.floor(Math.random() * active.length)];
                const gapMidAngle = this.gapAngle + (this.gapWidth / 2);

                target.vx = Math.cos(gapMidAngle) * 7;
                target.vy = Math.sin(gapMidAngle) * 7;

                this.spawnParticles(target.x, target.y, '#f59e0b', 12);
            }

            spawnParticles(x, y, color, count = 18) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1 + Math.random() * 4;
                    this.particles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        color: color || '#ef4444',
                        radius: 2 + Math.random() * 2.5,
                        alpha: 1.0
                    });
                }
            }

            update() {
                if (this.isPaused || this.isRoundOver) return;

                const dt = this.simSpeed;

                for (let step = 0; step < dt; step++) {
                    this.gapAngle += this.gapSpeed;

                    // Update Particles
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        const p = this.particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= 0.025;
                        if (p.alpha <= 0) this.particles.splice(i, 1);
                    }

                    // Update Balls
                    this.balls.forEach(ball => {
                        ball.update(1, this.centerX, this.centerY, this.arenaRadius, this.gapAngle, this.gapWidth);

                        // Once ball flies outside red ring and finishes eject animation
                        if (ball.state === 'EJECTING' && ball.ejectTimer >= 35) {
                            ball.state = 'ELIMINATED';
                            this.spawnParticles(ball.x, ball.y, ball.color, 20);
                            this.addEliminatedToUI(ball);
                            this.updateUI();
                        }
                    });

                    // Elastic ball-to-ball collisions inside arena
                    const active = this.balls.filter(b => b.state === 'BOUNCING');
                    for (let i = 0; i < active.length; i++) {
                        for (let j = i + 1; j < active.length; j++) {
                            const b1 = active[i];
                            const b2 = active[j];

                            const dx = b2.x - b1.x;
                            const dy = b2.y - b1.y;
                            const dist = Math.hypot(dx, dy);
                            const minDist = b1.r + b2.r;

                            if (dist < minDist) {
                                const nx = dx / (dist || 1);
                                const ny = dy / (dist || 1);

                                const overlap = (minDist - dist) / 2;
                                b1.x -= nx * overlap;
                                b1.y -= ny * overlap;
                                b2.x += nx * overlap;
                                b2.y += ny * overlap;

                                const kx = b1.vx - b2.vx;
                                const ky = b1.vy - b2.vy;
                                const p = 2 * (nx * kx + ny * ky) / 2;

                                b1.vx -= p * nx;
                                b1.vy -= p * ny;
                                b2.vx += p * nx;
                                b2.vy += p * ny;
                            }
                        }
                    }

                    // Winner Condition Check
                    if (active.length === 1 && !this.isRoundOver) {
                        const ejectingCount = this.balls.filter(b => b.state === 'EJECTING').length;
                        if (ejectingCount === 0) {
                            this.handleWinner(active[0]);
                        }
                    }
                }
            }

            addEliminatedToUI(country) {
                const container = document.getElementById('eliminatedContainer');
                if (container.children.length === 1 && container.children[0].tagName === 'SPAN') {
                    container.innerHTML = '';
                }

                const badge = document.createElement('div');
                badge.className = 'animate-pop-in flex items-center space-x-1 bg-gray-900/90 border border-red-500/40 px-2 py-0.5 rounded-full shrink-0 text-[10px] font-bold';
                
                const img = document.createElement('img');
                img.src = `https://flagcdn.com/w40/${country.code}.png`;
                img.className = 'w-3.5 h-3.5 rounded-full object-cover border border-gray-600';

                const name = document.createElement('span');
                name.className = 'text-gray-200';
                name.innerText = country.name;

                badge.appendChild(img);
                badge.appendChild(name);
                container.insertBefore(badge, container.firstChild);
            }

            updateUI() {
                const activeCount = this.balls.filter(b => b.state === 'BOUNCING').length;
                document.getElementById('remainingCount').innerText = `${activeCount} Remaining`;

                const alertBanner = document.getElementById('alertBanner');
                if (activeCount <= 5 && activeCount > 1) {
                    alertBanner.classList.remove('hidden');
                    document.getElementById('alertText').innerText = `FINAL ${activeCount} COUNTRIES!`;
                } else {
                    alertBanner.classList.add('hidden');
                }
            }

            handleWinner(winner) {
                this.isRoundOver = true;
                this.leaderboard[winner.name] = (this.leaderboard[winner.name] || 0) + 1;
                this.renderLeaderboard();

                audio.speak(`Winner ${winner.name}!`);

                const overlay = document.getElementById('winnerOverlay');
                const flagContainer = document.getElementById('winnerFlagContainer');
                
                flagContainer.innerHTML = `<img src="https://flagcdn.com/w160/${winner.code}.png" class="w-full h-full object-cover" alt="${winner.name}">`;
                document.getElementById('winnerName').innerText = winner.name;
                document.getElementById('winnerSubtext').innerText = `Total Wins: ${this.leaderboard[winner.name]} | Next Round...`;

                overlay.classList.remove('opacity-0', 'pointer-events-none');

                const progressBar = document.getElementById('nextRoundProgress');
                progressBar.style.width = '0%';
                setTimeout(() => { progressBar.style.width = '100%'; }, 50);

                // Auto restart next round continuously
                setTimeout(() => {
                    this.round++;
                    this.initRound();
                }, 4000);
            }

            renderLeaderboard() {
                const list = document.getElementById('leaderboardList');
                list.innerHTML = '';

                const sorted = Object.entries(this.leaderboard).sort((a, b) => b[1] - a[1]);

                if (sorted.length === 0) {
                    list.innerHTML = '<span class="text-gray-500 text-center block text-[10px] py-1 italic">No wins yet</span>';
                    return;
                }

                sorted.forEach(([name, wins]) => {
                    const countryObj = COUNTRIES_DATA.find(c => c.name === name) || { code: 'un' };
                    const item = document.createElement('div');
                    item.className = 'flex items-center justify-between bg-gray-800/80 px-1.5 py-0.5 rounded border border-gray-700/50';
                    item.innerHTML = `
                        <div class="flex items-center space-x-1 overflow-hidden">
                            <img src="https://flagcdn.com/w40/${countryObj.code}.png" class="w-3 h-3 rounded-full object-cover">
                            <span class="truncate text-gray-200 text-[10px]">${name}</span>
                        </div>
                        <span class="text-amber-400 font-extrabold text-[10px] ml-1">${wins}W</span>
                    `;
                    list.appendChild(item);
                });
            }

            render() {
                const width = this.canvas.width / (window.devicePixelRatio || 1);
                const height = this.canvas.height / (window.devicePixelRatio || 1);

                this.ctx.clearRect(0, 0, width, height);

                const startAngle = this.gapAngle + this.gapWidth;
                const endAngle = this.gapAngle + (Math.PI * 2);

                // Red Neon Boundary Wall
                this.ctx.save();
                this.ctx.beginPath();
                this.ctx.arc(this.centerX, this.centerY, this.arenaRadius, startAngle, endAngle);
                this.ctx.strokeStyle = '#ef4444';
                this.ctx.lineWidth = 4;
                this.ctx.shadowColor = '#ef4444';
                this.ctx.shadowBlur = 16;
                this.ctx.stroke();
                this.ctx.restore();

                // Rotating Dotted Red Opening Laser Gap
                this.ctx.save();
                this.ctx.beginPath();
                this.ctx.arc(this.centerX, this.centerY, this.arenaRadius, this.gapAngle, this.gapAngle + this.gapWidth);
                this.ctx.strokeStyle = '#f59e0b';
                this.ctx.lineWidth = 5;
                this.ctx.shadowColor = '#f59e0b';
                this.ctx.shadowBlur = 18;
                this.ctx.setLineDash([3, 3]);
                this.ctx.stroke();
                this.ctx.restore();

                // Draw Particle Explosions
                this.particles.forEach(p => {
                    this.ctx.save();
                    this.ctx.globalAlpha = Math.max(0, p.alpha);
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fill();
                    this.ctx.restore();
                });

                // DRAW FLAG BALLS
                this.balls.forEach(ball => {
                    if (ball.state === 'ELIMINATED') return;

                    this.ctx.save();
                    this.ctx.globalAlpha = Math.max(0, ball.alpha);

                    // Ejected trail vector outside ring
                    if (ball.trail.length > 0) {
                        ball.trail.forEach((t, idx) => {
                            this.ctx.beginPath();
                            this.ctx.arc(t.x, t.y, ball.r * (idx / ball.trail.length), 0, Math.PI * 2);
                            this.ctx.fillStyle = '#ef4444';
                            this.ctx.globalAlpha = (idx / ball.trail.length) * 0.3;
                            this.ctx.fill();
                        });
                        this.ctx.globalAlpha = Math.max(0, ball.alpha);
                    }

                    // Circle Clip for Flag Rendering
                    this.ctx.beginPath();
                    this.ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
                    this.ctx.clip();

                    const img = ball.flagImage;
                    if (img && img.complete && img.naturalWidth !== 0) {
                        this.ctx.drawImage(img, ball.x - ball.r, ball.y - ball.r, ball.r * 2, ball.r * 2);
                    } else {
                        this.ctx.fillStyle = ball.color || '#3b82f6';
                        this.ctx.fill();
                    }

                    this.ctx.restore();

                    // Outer Border
                    this.ctx.save();
                    this.ctx.globalAlpha = Math.max(0, ball.alpha);
                    this.ctx.beginPath();
                    this.ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
                    this.ctx.strokeStyle = ball.state === 'EJECTING' ? '#ef4444' : 'rgba(255, 255, 255, 0.85)';
                    this.ctx.lineWidth = 1.5;
                    this.ctx.stroke();
                    this.ctx.restore();
                });
            }

            loop() {
                this.update();
                this.render();
                requestAnimationFrame(() => this.loop());
            }
        }

        window.onload = () => {
            const game = new GameEngine();
            game.initRound();
            game.loop();

            const playPauseBtn = document.getElementById('playPauseBtn');
            const playPauseIcon = document.getElementById('playPauseIcon');
            const playPauseText = document.getElementById('playPauseText');

            playPauseBtn.addEventListener('click', () => {
                game.isPaused = !game.isPaused;
                if (game.isPaused) {
                    playPauseIcon.className = 'fa-solid fa-play';
                    playPauseText.innerText = 'Play';
                    playPauseBtn.className = 'bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded-xl text-xs font-black transition flex items-center gap-1 shadow-md';
                } else {
                    playPauseIcon.className = 'fa-solid fa-pause';
                    playPauseText.innerText = 'Pause';
                    playPauseBtn.className = 'bg-cyan-600 hover:bg-cyan-500 text-white px-2.5 py-1.5 rounded-xl text-xs font-black transition flex items-center gap-1 shadow-md';
                }
            });

            document.getElementById('skipRoundBtn').addEventListener('click', () => game.initRound());
            document.getElementById('nudgeBtn').addEventListener('click', () => game.nudgeHazard());

            const speedBtns = document.querySelectorAll('.speed-btn');
            speedBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    speedBtns.forEach(b => b.className = 'speed-btn px-2 py-0.5 text-[11px] font-bold rounded-lg bg-gray-800 text-gray-300');
                    btn.className = 'speed-btn px-2 py-0.5 text-[11px] font-bold rounded-lg bg-cyan-600 text-white font-black';
                    game.simSpeed = parseInt(btn.dataset.speed);
                });
            });

            const ttsToggleBtn = document.getElementById('ttsToggleBtn');
            const ttsIcon = document.getElementById('ttsIcon');

            ttsToggleBtn.addEventListener('click', () => {
                audio.speechEnabled = !audio.speechEnabled;
                ttsIcon.className = audio.speechEnabled ? 'fa-solid fa-volume-high text-cyan-400' : 'fa-solid fa-volume-xmark text-gray-500';
            });

            document.getElementById('resetLeaderboardBtn').addEventListener('click', () => {
                game.leaderboard = {};
                game.renderLeaderboard();
            });
        };
    </script>
</body>
